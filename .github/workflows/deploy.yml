name: Build Nompong Studio into docs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nompong-docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare GitHub Pages files
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          mkdir -p docs
          rsync -a --delete dist/ docs/
      - name: Commit built docs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: publish Nompong Studio to docs [skip ci]"
            git push origin HEAD:main
          fi
