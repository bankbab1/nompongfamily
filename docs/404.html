<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <script>
      // Apply the saved theme and language before first paint (see src/lib/theme.ts, src/lib/i18n.ts).
      (function () {
        var d = document.documentElement, t, l;
        try { t = localStorage.getItem('nompong.theme'); l = localStorage.getItem('nompong.locale'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.dataset.theme = t;
        if (l === 'th' || l === 'en') d.lang = l;
      })();
    </script>
    <title>Nompong Family — Nompong Studio</title>
    <meta name="description" content="บ้านอย่างเป็นทางการของ nompong family — สติกเกอร์ LINE วอลเปเปอร์ และ Nompong Studio สำหรับเสนอไอเดียชุดสติกเกอร์" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="nompong family" />

    <script type="module" crossorigin src="/nompongfamily/assets/index-CNIEivWx.js"></script>
    <link rel="modulepreload" crossorigin href="/nompongfamily/assets/Field-KEckifi1.js">
    <link rel="stylesheet" crossorigin href="/nompongfamily/assets/index-D1iFMNkx.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Display actionable diagnostics if the application cannot bootstrap.
      window.__nompongBooted = false;
      const showStartupError = (detail) => {
        if (window.__nompongBooted) return;
        const root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<main style="font:16px system-ui;padding:32px;max-width:680px;margin:auto;color:#514a43"><h1>Nompong Studio could not start</h1><p>Try a hard refresh (Ctrl+Shift+R), or open this page in a private window.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#fff4dc;padding:16px;border-radius:12px"></pre></main>';
        root.querySelector('pre').textContent = detail;
      };
      window.addEventListener('error', (e) => showStartupError(e.message || 'Script loading error'));
      window.addEventListener('unhandledrejection', (e) => showStartupError(String(e.reason || 'Unhandled promise rejection')));
      window.setTimeout(() => {
        if (!window.__nompongBooted && !document.querySelector('#root > *')) showStartupError('Application did not render after 10 seconds. Check the browser Network tab for failed JavaScript assets.');
      }, 10000);
    </script>
  </body>
</html>
